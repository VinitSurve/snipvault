[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "snipvault"
version = "1.0.0"
description = "Local-first SQLite FTS5 developer snippet library with macOS clipboard integration and parameterized templates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Vinit Surve" }]
keywords = ["cli", "developer-tools", "macos", "snipvault"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "platformdirs>=4.2.0",
  "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.0",
  "pytest-timeout>=2.3.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "build>=1.2.0",
]

[project.scripts]
snipvault = "snipvault.cli:main"

[project.urls]
Homepage = "https://github.com/VinitSurve/snipvault"
Repository = "https://github.com/VinitSurve/snipvault"
Issues = "https://github.com/VinitSurve/snipvault/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/snipvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
  "slow: slow tests",
  "macos: requires macOS",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "RUF", "PTH", "PL"]
ignore = [
  "S101",    # assert is used in tests
  "PLR2004", # magic numbers are fine in CLI code
  "PLR0913", # CLI commands have many options
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "S603",    # subprocess is used deliberately, always with argv lists
  "S607",    # partial executable paths are resolved intentionally
  "SIM108",
  "RUF012",
  "PLC0415", # lazy imports keep CLI start-up fast
  "PLR0917",
  "RUF001",
  "RUF002",
  "RUF003",
  "PTH100",
  "PTH101",
  "PTH103",
  "PTH105",
  "PTH108",
  "PTH111",
  "PTH120",
  "E501",    # line length is managed by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607", "PLR", "PTH", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["snipvault"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_ignores = true
warn_return_any = true
